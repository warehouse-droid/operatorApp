services:
  db:
    mem_limit: 768m
    memswap_limit: 768m
    labels:
      com.mbbs.lifecycle: disposable-test
  migrate:
    image: mbbs-operator-app:dispatch-editor-control-browser-test-20261015
    pull_policy: never
    working_dir: /app
    user: '1000:1000'
    entrypoint: []
    labels:
      com.mbbs.lifecycle: disposable-test
    volumes:
      - ${SPLIT_IF_RELEASE}/candidate/src:/app/src:ro
      - ${SPLIT_IF_RELEASE}/candidate/migrations:/app/migrations:ro
      - ${SPLIT_IF_RELEASE}/candidate/package.json:/app/package.json:ro
      - ./server/test-artifacts/operator-to-yard-flow-tooling/node_modules:/app/node_modules:ro
  test:
    image: mbbs-operator-app:dispatch-editor-control-browser-test-20261015
    pull_policy: never
    working_dir: /app
    user: '1000:1000'
    entrypoint: []
    mem_limit: 1536m
    memswap_limit: 1536m
    labels:
      com.mbbs.lifecycle: disposable-test
    volumes:
      - ${SPLIT_IF_SOURCE}/src:/app/src:ro
      - ${SPLIT_IF_RELEASE}/candidate/public:/app/public:ro
      - ${SPLIT_IF_RELEASE}/candidate/migrations:/app/migrations:ro
      - ${SPLIT_IF_RELEASE}/candidate/package.json:/app/package.json:ro
      - ${SPLIT_IF_RELEASE}/tests:/app/test:ro
      - ${SPLIT_IF_RELEASE}/eslint.mbt.config.js:/app/eslint.mbt.config.js:ro
      - ${SPLIT_IF_RELEASE}/tsconfig.mbt.json:/app/tsconfig.mbt.json:ro
      - ${SPLIT_IF_RELEASE}/.c8rc.json:/app/.c8rc.json:ro
      - ${SPLIT_IF_RELEASE}/evidence:/app/split-if-evidence
      - ./server/test-artifacts/operator-to-yard-flow-tooling/node_modules:/app/node_modules:ro
      - ./server/tools:/app/tools:ro
      - ./server/contracts:/app/contracts:ro
