<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MBBS SCM</title>
    <link rel="stylesheet" href="/dispatch.css?v=20260710-scm-schedule-toolbar-v1" />
    <link rel="stylesheet" href="/i18n.css?v=20260701-i18n-v2" />
  </head>
  <body>
    <main class="dispatch-shell dispatch-menu-shell" id="scmMenuApp"></main>
    <script src="/i18n.js?v=20260716-yard-movements-v1"></script>
    <script src="/app-sidebar.js?v=20260717-control-direct-routes-v1"></script>
    <script src="/dispatch-auth.js?v=20260716-multi-role-v1"></script>
    <script>
      const scmMenuApp = document.getElementById("scmMenuApp");
      const smt = (key, fallback) => MBBS_I18N.t(key, fallback);
      let scmMenuOperator = null;
      function scmMenuRole() {
        return String(scmMenuOperator?.role || "").trim().toLowerCase();
      }
      function scmCanEditScm() {
        return ["admin", "scm", "scm_staff"].includes(scmMenuRole());
      }
      function scmIsYardManager() {
        return ["yard_manager", "yard-manager", "yard manager"].includes(scmMenuRole());
      }
      function renderScmMenu() {
        const operator = scmMenuOperator || {};
        const canEdit = scmCanEditScm();
        const yardOnly = scmIsYardManager();
        scmMenuApp.innerHTML = `
          <header class="dispatch-topbar">
            <div>
              <p>${smt("app.transportation", "MBBS Transportation")}</p>
              <h1>SCM</h1>
            </div>
            <div class="topbar-language">${MBBS_I18N.toggleHtml()}</div>
            <div class="topbar-actions">
              <span class="dispatch-user">${operator.display_name || operator.username || ""}</span>
              <button onclick="location.href='/dispatch'" type="button">${smt("common.dispatch", "Dispatch")}</button>
              <button onclick="dispatchLogout()" type="button">${smt("common.logout", "Logout")}</button>
            </div>
          </header>
          <section class="dispatch-menu-page">
            <div class="dispatch-menu-heading">
              <h2>SCM Menu</h2>
              <p>Manage PO split/ref, local VRMA, and the transportation schedule shared with dispatch.</p>
            </div>
            <div class="dispatch-menu-grid">
              ${canEdit ? `<button class="dispatch-menu-card primary-card" onclick="location.href='/scm/transfer-dependencies'" type="button">
                <strong>Auto Transfer</strong>
                <span>Review Sales Order shortages, allocate stock across yards, and create dependent Transfer Orders.</span>
              </button>` : ""}
              ${canEdit ? `<button class="dispatch-menu-card primary-card" onclick="location.href='/scm/POsplit'" type="button">
                <strong>PO Split</strong>
                <span>Split blanket POs, update refs, destination yards, grouping, and schedule flags.</span>
              </button>` : ""}
              <button class="dispatch-menu-card ${yardOnly ? "primary-card" : ""}" onclick="location.href='/scm/POTOschedule'" type="button">
                <strong>PO / TO Schedule</strong>
                <span>Review queued, planned, completed, hold, priority, and yard inbound schedule views.</span>
              </button>
              ${canEdit ? `<button class="dispatch-menu-card" onclick="location.href='/scm/VRMA'" type="button">
                <strong>VRMA</strong>
                <span>Create local vendor return orders for dispatch planning under the PO pool.</span>
              </button>` : ""}
            </div>
          </section>
        `;
      }
      window.addEventListener("mbbs-language-changed", renderScmMenu);
      requireDispatchLogin({
        mount: scmMenuApp,
        roles: ["admin", "scm", "scm_staff", "dispatcher", "yard_manager"],
        onReady(operator) {
          scmMenuOperator = operator;
          renderScmMenu();
        }
      });
    </script>
  </body>
</html>
