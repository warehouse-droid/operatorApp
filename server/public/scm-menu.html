<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MBBS SCM</title>
    <link rel="stylesheet" href="/dispatch.css?v=20260810-scrollable-menu-v1" />
    <link rel="stylesheet" href="/i18n.css?v=20260701-i18n-v2" />
  </head>
  <body>
    <main class="dispatch-shell dispatch-menu-shell" id="scmMenuApp"></main>
    <script src="/i18n.js?v=20260716-yard-movements-v1"></script>
    <script src="/app-sidebar.js?v=20260819-dependency-manager-v1"></script>
    <script src="/dispatch-auth.js?v=20260716-multi-role-v1"></script>
    <script>
      const scmMenuApp = document.getElementById("scmMenuApp");
      const smt = (key, fallback) => MBBS_I18N.t(key, fallback);
      let scmMenuOperator = null;
      function scmMenuRoles() {
        const normalizeRole = (value) => String(value || "").trim().toLowerCase().replaceAll("-", "_").replaceAll(" ", "_");
        return new Set([
          ...(Array.isArray(scmMenuOperator?.roles) ? scmMenuOperator.roles : []),
          scmMenuOperator?.role
        ].map(normalizeRole).filter(Boolean));
      }
      function scmCanEditScm() {
        const roles = scmMenuRoles();
        return ["admin", "scm", "scm_staff"].some((role) => roles.has(role));
      }
      function scmIsYardManager() {
        return scmMenuRoles().has("yard_manager");
      }
      function scmCanViewDependencyManagement() {
        const roles = scmMenuRoles();
        return ["admin", "dispatcher", "scm", "scm_staff"].some((role) => roles.has(role));
      }
      function renderScmMenu() {
        const operator = scmMenuOperator || {};
        const canEdit = scmCanEditScm();
        const yardOnly = scmIsYardManager();
        scmMenuApp.innerHTML = `
          <header class="dispatch-topbar">
            <div>
              <p>${smt("app.transportation", "MBBS Transportation")}</p>
              <h1>SCM</h1>
            </div>
            <div class="topbar-language">${MBBS_I18N.toggleHtml()}</div>
            <div class="topbar-actions">
              <span class="dispatch-user">${operator.display_name || operator.username || ""}</span>
              <button onclick="location.href='/dispatch'" type="button">${smt("common.dispatch", "Dispatch")}</button>
              <button onclick="dispatchLogout()" type="button">${smt("common.logout", "Logout")}</button>
            </div>
          </header>
          <section class="dispatch-menu-page">
            <div class="dispatch-menu-heading">
              <h2>SCM Menu</h2>
              <p>Manage Custom Orders, PO split/ref, local VRMA, and the transportation schedule shared with dispatch.</p>
            </div>
            <div class="dispatch-menu-grid">
              ${canEdit ? `<button class="dispatch-menu-card primary-card" onclick="location.href='/scm/stock-requests'" type="button">
                <strong>Stock Requests from Sales</strong>
                <span>Review regular stock requests, adjust source and quantity, convert local pending TOs, then confirm and print real NetSuite TOs.</span>
              </button>` : ""}
              ${canEdit ? `<button class="dispatch-menu-card primary-card" onclick="location.href='/scm/to-printing'" type="button">
                <strong>Transfer Order Printing</strong>
                <span>Preview and print current NetSuite TO picking tickets, then review shared print history from every SCM workflow.</span>
              </button>` : ""}
              ${canEdit ? `<button class="dispatch-menu-card primary-card" onclick="location.href='/scm/custom-orders'" type="button">
                <strong>Custom Orders</strong>
                <span>Create and maintain local transportation orders that are not available in NetSuite.</span>
              </button>` : ""}
              <button class="dispatch-menu-card primary-card" onclick="location.href='/scm/smart'" type="button">
                <strong>Smart SCM</strong>
                <span>Review versioned inputs, demand evidence, Blanket sources, PO / TO suggestions, vendor replies, and controlled execution.</span>
              </button>
              ${canEdit ? `<button class="dispatch-menu-card primary-card" onclick="location.href='/scm/netsuite-po'" type="button">
                <strong>NetSuite PO history</strong>
                <span>Review and safely update application-created purchase orders against live NetSuite data.</span>
              </button>` : ""}

              ${canEdit ? `<button class="dispatch-menu-card primary-card" onclick="location.href='/scm/vendors'" type="button">
                <strong>Local Vendors</strong>
                <span>Add or rename local vendors and yards, then maintain each yard's opening days and hours.</span>
              </button>` : ""}
              ${scmCanViewDependencyManagement() ? `<button class="dispatch-menu-card primary-card" onclick="location.href='/scm/dependency-management'" type="button">
                <strong>Dependency Manager</strong>
                <span>Inspect and preview current SO, group, and split relationships. SCM can apply safe TO/PO changes; Dispatch has read-only visibility.</span>
              </button>` : ""}
              ${canEdit ? `<button class="dispatch-menu-card primary-card" onclick="location.href='/scm/transfer-dependencies'" type="button">
                <strong>Auto Transfer</strong>
                <span>Review Sales Order shortages, allocate stock across yards, and create dependent Transfer Orders.</span>
              </button>` : ""}
              ${canEdit ? `<button class="dispatch-menu-card primary-card" onclick="location.href='/scm/POsplit'" type="button">
                <strong>PO Split</strong>
                <span>Split blanket POs, update refs, destination yards, grouping, and schedule flags.</span>
              </button>` : ""}
              <button class="dispatch-menu-card ${yardOnly ? "primary-card" : ""}" onclick="location.href='/scm/POTOschedule'" type="button">
                <strong>PO / TO Schedule</strong>
                <span>Review PO / TO arrivals, priorities, and yard inbound schedule views.</span>
              </button>
              ${canEdit ? `<button class="dispatch-menu-card" onclick="location.href='/scm/schedule-formatting'" type="button">
                <strong>Schedule Formatting</strong>
                <span>Customize Status, Type, and Drop-off Point cell colors plus whole-row Status formatting.</span>
              </button>` : ""}
              ${canEdit ? `<button class="dispatch-menu-card" onclick="location.href='/scm/VRMA'" type="button">
                <strong>VRMA</strong>
                <span>Create local vendor return orders for dispatch planning under the PO pool.</span>
              </button>` : ""}
              <button class="dispatch-menu-card" onclick="location.href='/scm/route-rules'" type="button">
                <strong>PO Route Rules</strong>
                <span>Configure pickup-source stop priority, maximum drops, and partial-load hub redirection.</span>
              </button>
            </div>
          </section>
        `;
      }
      window.addEventListener("mbbs-language-changed", renderScmMenu);
      requireDispatchLogin({
        mount: scmMenuApp,
        roles: ["admin", "scm", "scm_staff", "dispatcher", "yard_manager"],
        onReady(operator) {
          scmMenuOperator = operator;
          renderScmMenu();
        }
      });
    </script>
  </body>
</html>
