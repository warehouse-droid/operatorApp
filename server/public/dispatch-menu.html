<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MBBS Dispatch</title>
    <link rel="stylesheet" href="/dispatch.css?v=20260701-i18n-v2" />
    <link rel="stylesheet" href="/i18n.css?v=20260701-i18n-v2" />
  </head>
  <body>
    <main class="dispatch-shell dispatch-menu-shell" id="dispatchMenuApp"></main>
    <script src="/i18n.js?v=20260716-yard-movements-v1"></script>
    <script src="/app-sidebar.js?v=20260717-po-to-schedule-v1"></script>
    <script src="/dispatch-auth.js?v=20260716-multi-role-v1"></script>
    <script>
      let dispatchMenuOperator = null;
      const dispatchMenuApp = document.getElementById("dispatchMenuApp");
      const mt = (key, fallback) => MBBS_I18N.t(key, fallback);
      function renderDispatchMenu() {
        const operator = dispatchMenuOperator || {};
        dispatchMenuApp.innerHTML = `
            <header class="dispatch-topbar">
              <div>
                <p>${mt("app.transportation", "MBBS Transportation")}</p>
                <h1>${mt("dispatch.dispatch", "Dispatch")}</h1>
              </div>
              <div class="topbar-language">${MBBS_I18N.toggleHtml()}</div>
              <div class="topbar-actions">
                <span class="dispatch-user">${operator.display_name || operator.username}</span>
                <button onclick="dispatchLogout()" type="button">${mt("common.logout", "Logout")}</button>
              </div>
            </header>
            <section class="dispatch-menu-page">
              <div class="dispatch-menu-heading">
                <h2>${mt("dispatch.menu", "Dispatch Menu")}</h2>
                <p>${mt("dispatch.menuDesc", "Open planning, setup, monitoring, statistics, or driver inspection photo review.")}</p>
              </div>
              <div class="dispatch-menu-grid">
                <button class="dispatch-menu-card primary-card" onclick="location.href='/dispatch/planning'" type="button">
                  <strong>${mt("dispatch.planning", "Planning")}</strong>
                  <span>${mt("dispatch.planningDesc", "Build daily truck loads, routes, CO transit moves, and stop sequences.")}</span>
                </button>
                <button class="dispatch-menu-card" onclick="location.href='/dispatch/po-to-schedule'" type="button">
                  <strong>${mt("dispatch.poToSchedule", "PO / TO Schedule")}</strong>
                  <span>${mt("dispatch.poToScheduleDesc", "Review purchase and transfer order transport schedules, status, yards, and ETA.")}</span>
                </button>
                <button class="dispatch-menu-card" onclick="location.href='/dispatch/monitor'" type="button">
                  <strong>${mt("dispatch.monitor", "Monitor")}</strong>
                  <span>${mt("dispatch.monitorDesc", "Watch Samsara truck locations, active loads, and yard reference points.")}</span>
                </button>
                <button class="dispatch-menu-card" onclick="location.href='/dispatch/statistics'" type="button">
                  <strong>${mt("dispatch.statistics", "Statistics")}</strong>
                  <span>${mt("dispatch.statisticsDesc", "Review driver stop time, delivery speed, planned overrun, and DVIR completion.")}</span>
                </button>
                <button class="dispatch-menu-card" onclick="location.href='/dispatch/dvir'" type="button">
                  <strong>${mt("dispatch.dvirPhotos", "DVIR Photos")}</strong>
                  <span>${mt("dispatch.dvirDesc", "Review pre-trip and post-trip photos captured in the MBBS driver PWA.")}</span>
                </button>
                <button class="dispatch-menu-card" onclick="location.href='/dispatch/loaded-export'" type="button">
                  <strong>${mt("control.loadedExport", "Yard In/Outbound")}</strong>
                  <span>${mt("control.loadedExportHelp", "Review processed receipts and loads for PO, TO, CO, SO, and VRMA orders.")}</span>
                </button>
                <button class="dispatch-menu-card" onclick="location.href='/dispatch/sales-order-methods'" type="button">
                  <strong>${mt("dispatch.salesOrderMethods", "SO Method")}</strong>
                  <span>${mt("dispatch.salesOrderMethodsDesc", "Override local sales order method so pickup orders can be planned by dispatch when needed.")}</span>
                </button>
                <button class="dispatch-menu-card" onclick="location.href='/dispatch/snapshot'" type="button">
                  <strong>${mt("dispatch.snapshotRecovery", "Snapshot Recovery")}</strong>
                  <span>${mt("dispatch.snapshotRecoveryDesc", "Review saved dispatch plan versions and restore a previous snapshot.")}</span>
                </button>
                <button class="dispatch-menu-card" onclick="location.href='/dispatch/setup'" type="button">
                  <strong>${mt("dispatch.setup", "Setup")}</strong>
                  <span>${mt("dispatch.setupDesc", "Drivers, trucks, vendor hours, parser rules, and dispatch action log.")}</span>
                </button>
              </div>
            </section>
          `;
      }
      window.addEventListener("mbbs-language-changed", renderDispatchMenu);
      requireDispatchLogin({
        mount: dispatchMenuApp,
        onReady(operator) {
          dispatchMenuOperator = operator;
          renderDispatchMenu();
        }
      });
    </script>
  </body>
</html>
