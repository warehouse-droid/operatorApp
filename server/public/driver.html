<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MBBS Driver</title>
    <meta name="theme-color" content="#006f6b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MBBS Driver" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/driver-manifest.webmanifest" />
    <link rel="icon" href="/icons/mbbs-yard.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/mbbs-yard-192.png" />
    <link rel="stylesheet" href="/driver.css?v=20260819-driver-route-readiness-v1" />
    <link rel="stylesheet" href="/i18n.css?v=20260819-driver-route-readiness-v1" />
  </head>
  <body>
    <main id="driverApp"></main>
    <aside id="driverOfflineStatus" class="driver-offline-status" hidden aria-live="polite"></aside>
    <aside
      id="driverRouteChangeStatus"
      class="driver-route-change-status"
      role="region"
      aria-live="assertive"
      hidden
    ></aside>
    <section
      id="driverSyncHold"
      class="driver-sync-hold"
      role="dialog"
      aria-modal="true"
      aria-live="assertive"
      aria-labelledby="driverSyncHoldTitle"
      aria-describedby="driverSyncHoldMessage"
      tabindex="-1"
      hidden
    >
      <div class="driver-sync-hold-card">
        <span class="driver-sync-spinner" aria-hidden="true"></span>
        <strong id="driverSyncHoldTitle" data-driver-sync-title></strong>
        <p id="driverSyncHoldMessage" data-driver-sync-message></p>
      </div>
    </section>
    <div id="driverToast" class="driver-toast"></div>
    <script src="/i18n.js?v=20260819-driver-route-readiness-v1"></script>
    <script src="/driver-offline-db.js?v=20260819-driver-route-readiness-v1"></script>
    <script src="/driver-photo-hash.js?v=20260819-driver-route-readiness-v1"></script>
    <script src="/driver-offline-photos.js?v=20260819-driver-route-readiness-v1"></script>
    <script src="/driver-offline-sync.js?v=20260819-driver-route-readiness-v1"></script>
    <script src="/driver-bin-ui.js?v=20260819-driver-route-readiness-v1"></script>
    <script src="/driver-location-override.js?v=20260819-driver-route-readiness-v1"></script>
    <script src="/driver.js?v=20260819-driver-route-readiness-v1"></script>
  </body>
</html>
