name: mbbs-operator-app

x-app-common: &app-common
  build:
    context: ./server
  volumes:
    - app_data:/app/data
    - ./docker/env/.env:/app/.env:ro
    - ./docker/env/.env.old:/app/.env.old:ro
  networks:
    - mbbs

services:
  db:
    image: postgres:18-alpine
    env_file:
      - ./docker/env/.env
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - mbbs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    cpus: "2.0"
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - mbbs
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app:
    <<: *app-common
    environment:
      PORT: 3000
      NODE_ENV: production
      DISPATCH_PLANNER_ORDER_POOL_MODE: ${DISPATCH_PLANNER_ORDER_POOL_MODE:-on}
      DISPATCH_DRIVER_ORIENTED_PLANNING: ${DISPATCH_DRIVER_ORIENTED_PLANNING:-true}
      SALES_PUBLIC_ACCESS_ENABLED: ${SALES_PUBLIC_ACCESS_ENABLED:-true}
      SMART_SCM_LIVE_EXECUTION_ENABLED: ${SMART_SCM_LIVE_EXECUTION_ENABLED:-true}
    ports:
      - "127.0.0.1:${MBBS_APP_HOST_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped

  webhook-worker:
    <<: *app-common
    command: ["node", "src/netsuite-order-webhook-worker.js"]
    cpus: "1.0"
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      NETSUITE_ORDER_WEBHOOK_WORKER_CONCURRENCY: "1"
      NETSUITE_ORDER_WEBHOOK_WORKER_POLL_MS: "1000"
      SMART_SCM_LIVE_EXECUTION_ENABLED: ${SMART_SCM_LIVE_EXECUTION_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    <<: *app-common
    command: ["npm", "run", "migrate"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]
    restart: "no"

  bootstrap-data:
    image: alpine:3.22
    command:
      - /bin/sh
      - -c
      - |
        if [ ! -f /target/.mbbs-data-bootstrapped ]; then
          cp -a /source/. /target/
          touch /target/.mbbs-data-bootstrapped
        fi
        chown -R 1000:1000 /target
    volumes:
      - ./server/data:/source:ro
      - app_data:/target
    profiles: ["tools"]
    restart: "no"

  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "qwen3:4b-instruct"]
    networks:
      - mbbs
    depends_on:
      ollama:
        condition: service_healthy
    profiles: ["tools"]
    restart: "no"

networks:
  mbbs:
    driver: bridge

volumes:
  postgres_data:
  app_data:
  ollama_models:
