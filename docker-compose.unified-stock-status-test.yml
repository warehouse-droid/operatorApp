services:
  db:
    image: postgres:18-alpine
    pull_policy: never
  test:
    image: mbbs-operator-app:dispatch-editor-control-browser-test-20261015
    working_dir: /app
    entrypoint: []
    user: '1000:1000'
    pull_policy: never
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - ./server/src:/app/src:ro
      - ./server/public:/app/public:ro
      - ./server/migrations:/app/migrations:ro
      - ./server/test:/app/test:ro
      - ./server/tools:/app/tools:ro
      - ./server/contracts:/app/contracts:ro
      - ./server/package.json:/app/package.json:ro
      - ./server/package-lock.json:/app/package-lock.json:ro
      - ./server/test-artifacts/mbr-contract/toolchain/node_modules:/app/node_modules:ro
      - ./server/test-artifacts/mbr-contract/playwright-browsers:/ms-playwright:ro
      - ./server/eslint.mbt.config.js:/app/eslint.mbt.config.js:ro
      - ./server/test-artifacts:/app/test-artifacts
  migrate:
    image: mbbs-operator-app:dispatch-editor-control-browser-test-20261015
    working_dir: /app
    entrypoint: []
    user: '1000:1000'
    pull_policy: never
    volumes:
      - ./server/src:/app/src:ro
      - ./server/migrations:/app/migrations:ro
      - ./server/package.json:/app/package.json:ro
      - ./server/test-artifacts/mbr-contract/toolchain/node_modules:/app/node_modules:ro
